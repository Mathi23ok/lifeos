name: Release

# Push a tag like v1.0.0 to publish a shared-hosting zip on GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build shared-hosting zip
        run: git archive --format=zip -o "lifeos-${GITHUB_REF_NAME}.zip" HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "lifeos-${GITHUB_REF_NAME}.zip" \
            --title "Edi Life OS $GITHUB_REF_NAME" --generate-notes
